
<div class="p-6 max-w-3xl mx-auto">
  <div class="flex items-center justify-between mb-6">
    <h2 class="text-2xl font-bold flex items-center gap-2"><span class="text-primary">🛡️</span> Role Management</h2>
    <button class="btn btn-primary" (click)="startCreate()">
      <span class="mr-1">➕</span> Add Role
    </button>
  </div>

  <div class="card bg-base-100 shadow-xl my-6">
    <div class="overflow-x-auto px-4">
      <table class="table w-full" *ngIf="roles.length > 0">
        <thead class="border-b border-base-300">
          <tr>
            <th>Name</th>
            <th>Permissions</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let role of pagedRoles">
            <td>{{ role.name }}</td>
            <td>
              <span class="badge badge-info mr-1 mb-1" *ngFor="let perm of role.permissions">{{ perm }}</span>
            </td>
            <td>
              <button class="btn btn-warning btn-sm mr-2" (click)="startEdit(role)">✏️ Edit</button>
              <button class="btn btn-error btn-sm" (click)="openDeleteModal(role)">🗑️ Delete</button>
            </td>
          </tr>
        </tbody>
      </table>
      <div class="text-center text-gray-400 py-8" *ngIf="roles.length === 0">No roles found.</div>

      <!-- Pagination Bar -->
      <div class="flex flex-col sm:flex-row items-center justify-between py-4 gap-2" *ngIf="roles.length > 0">
        <div class="flex items-center gap-2 mb-2 sm:mb-0">
          <label class="label-text">Page size:</label>
          <select class="select select-bordered select-sm w-auto" [(ngModel)]="pageSize" (ngModelChange)="setPage(1)">
            <option *ngFor="let size of [5, 10, 20, 50]" [value]="size">{{ size }}</option>
          </select>
        </div>
        <div class="join">
          <button class="join-item btn btn-sm"
            [disabled]="page === 1"
            (click)="setPage(page - 1)">
            «
          </button>
          <button
            *ngFor="let p of [].constructor(totalPages); let i = index"
            class="join-item btn btn-sm"
            [ngClass]="{'btn-active': page === i + 1}"
            (click)="setPage(i + 1)">
            {{ i + 1 }}
          </button>
          <button class="join-item btn btn-sm"
            [disabled]="page === totalPages"
            (click)="setPage(page + 1)">
            »
          </button>
        </div>
      </div>
    </div>
  </div>

  <!-- Modal -->
  <dialog id="role-form-modal" class="modal modal-bottom sm:modal-middle" (click)="onBackdropClick($event)">
    <div class="modal-box relative">
      <button class="btn btn-sm btn-circle btn-ghost absolute right-2 top-2" (click)="cancel()">✕</button>
      <h3 class="font-bold text-lg mb-4">{{ isCreating ? 'Create Role' : 'Edit Role' }}</h3>
      <form (ngSubmit)="saveRole()" #roleForm="ngForm" class="space-y-4" *ngIf="selectedRole">
        <div class="form-control mb-4">
          <label class="label">
            <span class="label-text">Name</span>
          </label>
          <input [(ngModel)]="selectedRole.name" name="name" required class="input input-bordered w-full" />
        </div>
        <div class="form-control mb-4">
          <label class="label">
            <span class="label-text">Permissions</span>
          </label>
          <div class="relative">
            <!-- Chips for selected permissions -->
            <div class="flex flex-wrap gap-2 mb-2">
              <span *ngFor="let perm of selectedRole.permissions" class="badge badge-info gap-1">
                {{ perm }}
                <button type="button" class="btn btn-xs btn-circle btn-ghost ml-1" (click)="removePermissionChip(perm)">✕</button>
              </span>
            </div>
            <!-- Autocomplete input -->
            <input type="text" [(ngModel)]="permissionInput" name="permissionInput" autocomplete="off"
              (input)="filterPermissionSuggestions()" (keydown.enter)="addPermissionChip()"
              class="input input-bordered w-full" placeholder="Type to search permissions..." />
            <!-- Suggestions dropdown -->
            <ul *ngIf="filteredPermissionSuggestions.length > 0 && permissionInput" class="absolute z-10 bg-base-100 w-full mt-1 rounded shadow border border-base-200 max-h-40 overflow-auto">
              <li *ngFor="let suggestion of filteredPermissionSuggestions" (click)="selectPermissionSuggestion(suggestion.name)"
                  class="px-3 py-2 cursor-pointer hover:bg-base-200">
                {{ suggestion.name }}
              </li>
            </ul>
          </div>
        </div>
        <div class="modal-action">
          <button class="btn" type="button" (click)="cancel()">Cancel</button>
          <button class="btn btn-primary" type="submit" [disabled]="!roleForm.form.valid">💾 Save</button>
        </div>
      </form>
    </div>
  </dialog>

  <!-- Delete Confirmation Modal -->
  <dialog id="role-delete-modal" class="modal modal-bottom sm:modal-middle">
    <div class="modal-box max-w-md py-6">
      <div class="flex flex-col items-center text-center">
        <div class="mb-3 flex h-12 w-12 items-center justify-center rounded-full bg-error/10">
          <span class="pi pi-exclamation-triangle text-2xl text-error"></span>
        </div>
        <h3 class="mb-2 text-xl font-bold text-base-content">Confirm Deletion</h3>
        <p class="mb-5 text-base text-base-content/70">
          Are you sure you want to delete <strong class="text-base-content">{{ deleteItemName }}</strong>?
        </p>
        <div class="flex w-full gap-3">
          <button class="btn btn-ghost flex-1" type="button" (click)="closeDeleteModal()">Cancel</button>
          <button class="btn btn-error flex-1" type="button" [class.loading]="deletingInProgress" (click)="confirmDelete()">
            @if (deletingInProgress) {
              <span class="loading loading-spinner loading-sm"></span>
              Deleting...
            } @else {
              Yes, Delete
            }
          </button>
        </div>
      </div>
    </div>
    <form method="dialog" class="modal-backdrop">
      <button type="button" (click)="closeDeleteModal()">close</button>
    </form>
  </dialog>
</div>
