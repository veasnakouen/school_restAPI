[build]
  # Setting CI=false prevents Create React App from failing the build due to warnings
  command = "CI=false npm run build"
  publish = "build" # Note: Change to "dist" if your project uses Vite instead of Create React App

[[redirects]]
  # This ensures React Router handles all page navigation without 404 errors
  from = "/*"
  to = "/index.html"
  status = 200